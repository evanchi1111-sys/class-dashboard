<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班級儀表板</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#2a7cc6 0%,#74bbe8 45%,#0f6a82 55%,#0a3342 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(1100px,100%);text-align:center}
small{display:block;letter-spacing:6px;font-size:14px;opacity:.85}
h1{font-size:clamp(30px,5vw,48px);margin:6px 0 6px;text-shadow:0 2px 8px rgba(0,30,60,.5)}
p.sub{font-size:clamp(16px,2.2vw,22px);margin-bottom:28px;text-shadow:0 1px 4px rgba(0,30,60,.5)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
button.card{cursor:pointer;border:2px solid rgba(255,255,255,.35);border-radius:28px;color:#fff;padding:28px 22px 26px;font:inherit;backdrop-filter:blur(8px);box-shadow:0 14px 40px rgba(0,0,0,.3);transition:transform .2s,border-color .2s}
button.card:hover,button.card:focus-visible{transform:translateY(-6px);border-color:#fff;outline:none}
.bird{background:linear-gradient(180deg,rgba(120,200,255,.55),rgba(80,170,90,.6))}
.fish{background:linear-gradient(180deg,rgba(40,170,190,.6),rgba(8,60,100,.75))}
.card .em{font-size:84px;line-height:1.1}
.card h2{font-size:34px;margin:8px 0 6px}
.card .d{font-size:18px;line-height:1.7;opacity:.95}
.card .go{display:inline-block;margin-top:16px;padding:10px 30px;border-radius:99px;background:#fff;color:#0b3b52;font-weight:700;font-size:20px}
.note{margin-top:26px;font-size:16px;opacity:.9;text-shadow:0 1px 4px rgba(0,30,60,.5);line-height:1.7}
</style>
</head>
<body>
<div class="wrap" id="pick" style="visibility:hidden">
 <small>CLASS DASHBOARD</small>
 <h1>班級儀表板</h1>
 <p class="sub">請選擇這個班級要養什麼</p>
 <div class="cards">
  <button class="card bird" data-t="bird"><div class="em">🐦 🥚 🦜</div><h2>鳥類版本</h2><div class="d">每位同學養一隻鳥<br>150 種鳥（含臺中閱讀認證等級鳥）<br>藍天草地的鳥園</div><span class="go">進入鳥類版本</span></button>
  <button class="card fish" data-t="fish"><div class="em">🐠 🥚 🐙</div><h2>水族箱版本</h2><div class="d">每位同學養一條魚<br>200 種魚（附真實照片）<br>海底世界的水族箱</div><span class="go">進入水族箱版本</span></button>
 </div>
 <p class="note">兩個版本的任務、聯絡簿、考試、商店、金幣等功能相同，資料各自保存。<br>之後想換，到「教師控制台」按「切換版本」即可，原本的進度不會消失。</p>
</div>
<script>
const KEYT='classdashboard.theme',PAGE={bird:'bird.html',fish:'fish.html'};
let t=null;try{t=localStorage.getItem(KEYT)}catch(e){}
const choose=/[?&]choose=/.test(location.search);
if(!choose&&PAGE[t])location.replace(PAGE[t]);
else{document.getElementById('pick').style.visibility='visible';
 document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const k=b.dataset.t;try{localStorage.setItem(KEYT,k)}catch(e){}location.href=PAGE[k]})}
</script>
</body>
</html>
